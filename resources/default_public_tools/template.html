<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课件标题</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: #17342d;
      background: #edf8f4;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }
    .deck { width: 100%; height: 100%; }
    .slide {
      display: none;
      width: 100%;
      height: 100%;
      padding: 6vh 7vw;
      background: linear-gradient(145deg, #f7fcfa 0%, #e5f5ef 100%);
    }
    .slide.is-active { display: block; }
    h1 { margin: 0 0 3vh; font-size: clamp(38px, 5vw, 72px); }
    p { font-size: clamp(22px, 2.4vw, 36px); line-height: 1.65; }
    .progress {
      position: fixed;
      right: 3vw;
      bottom: 2.5vh;
      color: #52746b;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="deck">
    <section class="slide is-active">
      <h1>课件标题</h1>
      <p>请依据原始需求替换本页内容，并按需增加 slide。</p>
    </section>
  </main>
  <div class="progress" aria-live="polite"></div>
  <script>
    const slides = [...document.querySelectorAll('.slide')];
    const progress = document.querySelector('.progress');
    let current = 0;

    function render() {
      slides.forEach((slide, index) => slide.classList.toggle('is-active', index === current));
      progress.textContent = `${current + 1} / ${slides.length}`;
    }

    document.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) current = Math.min(slides.length - 1, current + 1);
      if (['ArrowLeft', 'PageUp'].includes(event.key)) current = Math.max(0, current - 1);
      render();
    });
    render();
  </script>
</body>
</html>
